project_config: configs/project_config.yaml

training:
  train_file: data/processed/train.jsonl
  valid_file: data/processed/valid.jsonl
  output_adapter_dir: outputs/adapters/exaone-security-lora
  checkpoint_dir: outputs/checkpoints/final
  logging_dir: logs/train
  save_total_limit: 3
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_seq_length: 3072
  logging_steps: 5
  eval_steps: 25
  save_steps: 25
  seed: 42
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  max_steps: -1

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

generation:
  max_new_tokens: 256
  temperature: 0.2
  top_p: 0.9
  do_sample: false
