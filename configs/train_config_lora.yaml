project_config: configs/project_config_lora.yaml

training:
  train_file: data/processed/train.jsonl
  valid_file: data/processed/valid.jsonl
  output_adapter_dir: outputs/adapters/exaone-security-lora-m4
  checkpoint_dir: outputs/checkpoints/lora-m4
  logging_dir: logs/train/lora-m4
  debug_dir: logs/debug/lora-m4
  save_total_limit: 2
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_seq_length: 256
  logging_steps: 5
  eval_steps: 1000
  save_steps: 1000
  seed: 42
  bf16: false
  gradient_checkpointing: true
  optim: adamw_torch
  max_steps: 20
  use_mps_device: true
  dataloader_num_workers: 0
  dataloader_pin_memory: false
  dataloader_persistent_workers: false
  skip_memory_metrics: true
  use_cache: false
  evaluation_strategy: "no"
  save_strategy: "no"
  logging_strategy: "steps"

lora:
  r: 8
  alpha: 16
  dropout: 0.1
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

generation:
  max_new_tokens: 128
  temperature: 0.1
  top_p: 0.9
  do_sample: false
